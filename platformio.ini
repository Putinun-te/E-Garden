; E-Garden firmware: one environment per node, plus host-side unit tests.
;   Build all nodes:  pio run
;   Build one node:   pio run -e hub
;   Unit tests:       pio test -e native
; Each node's code lives in firmware/<node>/ (app.cpp + <node>.ino for the Arduino IDE).
; Shared code lives in libraries/EGarden.

[platformio]
src_dir = firmware
data_dir = firmware/hub/data
lib_dir = libraries
default_envs = hub, water, air, pump

[esp32]
; espressif32 6.9.0 ships arduino-esp32 2.0.17, the core the project was built with
platform = espressif32@6.9.0
board = esp32dev
framework = arduino
monitor_speed = 115200
lib_deps =
    sandeepmistry/LoRa@0.8.0

[env:hub]
extends = esp32
build_src_filter = +<hub/> -<hub/*.ino>
lib_deps =
    ${esp32.lib_deps}
    esp32async/AsyncTCP@3.4.7
    esp32async/ESPAsyncWebServer@3.8.0

[env:water]
extends = esp32
build_src_filter = +<water/> -<water/*.ino>
lib_deps =
    ${esp32.lib_deps}
    plerup/EspSoftwareSerial@8.2.0

[env:air]
extends = esp32
build_src_filter = +<air/> -<air/*.ino>
lib_deps =
    ${esp32.lib_deps}
    plerup/EspSoftwareSerial@8.2.0
    paulstoffregen/OneWire@2.3.8
    milesburton/DallasTemperature@4.0.4
    claws/BH1750@1.3.0
    adafruit/Adafruit AHTX0@2.0.5

[env:pump]
extends = esp32
build_src_filter = +<pump/> -<pump/*.ino>

; Host-side unit tests for the pure C++ parts of libraries/EGarden
[env:native]
platform = native
test_framework = unity
build_src_filter = -<*>
lib_compat_mode = off
build_flags = -std=c++17 -Wall -Wextra
